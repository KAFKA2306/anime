name: Offline retag all years

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/retag-all-years.trigger'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: offline-retag-all-years-final
  cancel-in-progress: false

jobs:
  retag:
    if: >-
      (github.event_name == 'pull_request' && github.actor != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[automation] retag all years ontology v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test ontology rules
        run: npm test

      - name: Rebuild every cached attribute without network
        run: npm run attributes:rebuild-cache

      - name: Apply ontology v2 to canonical and all yearly JSON
        run: npm run attributes:apply

      - name: Verify all years and catalogue integrity
        run: |
          npm run attributes:verify
          npm run validate
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          const files = (await readdir('data/by-year')).filter((name) => /^\d{4}\.json$/.test(name)).sort();
          if (!files.length) throw new Error('No yearly JSON files found.');
          let memberships = 0;
          for (const file of files) {
            const payload = JSON.parse(await readFile(`data/by-year/${file}`, 'utf8'));
            if (payload.attribute_coverage?.coverage_ratio !== 1) throw new Error(`${file}: coverage is not 100%`);
            if (payload.attribute_coverage?.ontology_version !== '2.0.0') throw new Error(`${file}: stale ontology`);
            for (const work of payload.works) {
              memberships += 1;
              if (work.ontology_version !== '2.0.0') throw new Error(`${file}/${work.work_id}: stale embedded ontology`);
              const serialized = JSON.stringify({ tags: work.canonical_tags, facets: work.ontology_facets });
              if (serialized.includes('SF・ファンタジー')) throw new Error(`${file}/${work.work_id}: deprecated combined tag remains`);
            }
          }
          const y2025 = JSON.parse(await readFile('data/by-year/2025.json', 'utf8'));
          if (y2025.works.length !== 307) throw new Error(`2025 count changed: ${y2025.works.length}`);
          console.log(JSON.stringify({ year_files: files.length, memberships, y2025_count: y2025.works.length }, null, 2));
          NODE

      - name: Commit and push generated ontology data in bounded batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config http.postBuffer 524288000

          mapfile -d '' attribute_files < <(find attributes/by-work -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
          attribute_batch_size=400
          attribute_batch_number=0
          for ((start=0; start<${#attribute_files[@]}; start+=attribute_batch_size)); do
            batch=("${attribute_files[@]:start:attribute_batch_size}")
            git add -- "${batch[@]}"
            if git diff --cached --quiet; then
              continue
            fi
            attribute_batch_number=$((attribute_batch_number + 1))
            git commit -m "Regenerate ontology v2 attribute cache batch ${attribute_batch_number}"
            git push origin HEAD:"$TARGET_BRANCH"
          done

          mapfile -d '' year_files < <(find data/by-year -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
          year_batch_size=5
          year_batch_number=0
          for ((start=0; start<${#year_files[@]}; start+=year_batch_size)); do
            batch=("${year_files[@]:start:year_batch_size}")
            git add -- "${batch[@]}"
            if git diff --cached --quiet; then
              continue
            fi
            year_batch_number=$((year_batch_number + 1))
            git commit -m "Apply ontology v2 to yearly catalogue batch ${year_batch_number}"
            git push origin HEAD:"$TARGET_BRANCH"
          done

          git add data/works.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply ontology v2 to canonical works'
            git push origin HEAD:"$TARGET_BRANCH"
          fi

          git add data/manifest.json diagnostics/attribute-cache-rebuild.json diagnostics/attribute-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record all-year ontology v2 verification'
            git push origin HEAD:"$TARGET_BRANCH"
          fi

          echo "Pushed ${attribute_batch_number} attribute batches and ${year_batch_number} yearly data batches."

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'All-year offline retag workflow completed.'
