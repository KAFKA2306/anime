name: Probe GitHub Pages configuration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/probe-pages-config.trigger'

permissions:
  contents: write
  pages: read

concurrency:
  group: probe-pages-config-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Capture Pages configuration and latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verification
          gh api "repos/$GITHUB_REPOSITORY/pages" > verification/pages-config.json
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > verification/pages-build-latest.json
          cat verification/pages-config.json
          cat verification/pages-build-latest.json

      - name: Commit Pages probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/pages-config.json verification/pages-build-latest.json
          git commit -m 'Record GitHub Pages configuration probe'
          git push origin HEAD:"$TARGET_BRANCH"
