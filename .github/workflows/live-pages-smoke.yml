name: Verify live GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - tag-ranking.css
      - tag-ranking.js
      - explore/**
      - data/**
      - preferences/**
      - scripts/lib/recommendation-model.mjs
      - scripts/build-preference-model.mjs
      - scripts/build-recommendations.mjs
      - scripts/verify-recommendations.mjs
      - tests/recommendation-model.test.mjs
      - .github/workflows/pages.yml
      - .github/workflows/live-pages-smoke.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages source configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | jq '{html_url, status, build_type, source, public}'

      - name: Verify production HTML and wrapped tag assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/anime"
          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages"
          tmp="$(mktemp -d)"

          matched=false
          for attempt in $(seq 1 36); do
            deployment_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/gh-pages" --jq '.commit.message' 2>/dev/null || true)"
            if [[ "$deployment_message" != "Deploy ${GITHUB_SHA}" ]]; then
              echo "gh-pages has not deployed ${GITHUB_SHA} yet (attempt ${attempt})."
              sleep 10
              continue
            fi
            curl --fail --silent --show-error --location \
              "$raw_base/index.html?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/expected-index.html"
            curl --fail --silent --show-error --location \
              "$base/?year=2026&smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/index.html"
            expected_sha="$(sha256sum "$tmp/expected-index.html" | cut -d' ' -f1)"
            live_sha="$(sha256sum "$tmp/index.html" | cut -d' ' -f1)"
            if [[ "$expected_sha" == "$live_sha" ]]; then
              matched=true
              break
            fi
            echo "Live site has not propagated the current gh-pages index yet (attempt ${attempt})."
            sleep 10
          done
          test "$matched" = true

          grep -F 'id="yearSelect"' "$tmp/index.html"
          grep -F 'id="searchInput"' "$tmp/index.html"
          grep -F 'id="workGrid"' "$tmp/index.html"
          grep -F 'id="activeFilterBar"' "$tmp/index.html"
          grep -F 'id="mobileStatusText"' "$tmp/index.html"
          grep -F 'tag-ranking.css?v=20260725-all-years-tags-1' "$tmp/index.html"
          grep -F 'tag-ranking.js' "$tmp/index.html"

          curl --fail --silent --show-error --location \
            "$base/explore/?smoke=${GITHUB_SHA}" -o "$tmp/explore.html"
          grep -F '年度・作品名・タグから候補を絞り、気になる作品を公式ページで確かめられます。' "$tmp/explore.html"
          grep -F 'href="#filters">作品を探す</a>' "$tmp/explore.html"
          grep -F 'id="filters"' "$tmp/explore.html"
          grep -F 'id="results"' "$tmp/explore.html"

          curl --fail --silent --show-error --location \
            "$base/styles.css?smoke=${GITHUB_SHA}" -o "$tmp/styles.css"
          grep -F -- '--lavender:' "$tmp/styles.css"
          grep -F -- '--rose:' "$tmp/styles.css"
          grep -F -- '--mint:' "$tmp/styles.css"

          curl --fail --silent --show-error --location \
            "$base/tag-ranking.css?smoke=${GITHUB_SHA}" -o "$tmp/tag-ranking.css"
          grep -F 'content-visibility: auto' "$tmp/tag-ranking.css"
          grep -F '.responsive-control' "$tmp/tag-ranking.css"
          grep -F '.mobile-status' "$tmp/tag-ranking.css"
          grep -F 'flex-wrap: wrap' "$tmp/tag-ranking.css"
          grep -F 'overflow: visible' "$tmp/tag-ranking.css"
          grep -F 'white-space: normal' "$tmp/tag-ranking.css"
          if grep -F 'overflow-x: auto' "$tmp/tag-ranking.css" | grep -F 'work-card'; then
            echo 'Per-card horizontal tag scrolling is still present.' >&2
            exit 1
          fi

          curl --fail --silent --show-error --location \
            "$base/app.js?smoke=${GITHUB_SHA}" -o "$tmp/app.js"
          node --check "$tmp/app.js"

          curl --fail --silent --show-error --location \
            "$base/tag-ranking.js?smoke=${GITHUB_SHA}" -o "$tmp/tag-ranking.js"
          node --check "$tmp/tag-ranking.js"
          grep -F 'normalize(tag) === normalize(activeTag)' "$tmp/tag-ranking.js"
          grep -F 'タグ内 #' "$tmp/tag-ranking.js"
          grep -F "url.searchParams.set('tag'" "$tmp/tag-ranking.js"

          curl --fail --silent --show-error --location \
            "$base/data/manifest.json?smoke=${GITHUB_SHA}" -o "$tmp/manifest.json"
          python -m json.tool "$tmp/manifest.json" >/dev/null

          curl --fail --silent --show-error --location \
            "$base/data/recommendations/kafka/2026.json?smoke=${GITHUB_SHA}" -o "$tmp/recommendations-2026.json"
          python -m json.tool "$tmp/recommendations-2026.json" >/dev/null
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if(p.profile_id!=='kafka'||!Array.isArray(p.recommendations)||p.recommendations.length===0) process.exit(1)" "$tmp/recommendations-2026.json"

          echo "Live Pages smoke test passed: $base/?year=2026 and learned recommendations"

      - name: Record verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/gh-pages" --jq '.commit.message')"
          deployed_source_commit="${deployment_message#Deploy }"
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          marker="$(mktemp)"
          cat > "$marker" <<JSON
          {
            "status": "passed",
            "site": "https://kafka2306.github.io/anime/?year=2026",
            "deployed_source_commit": "${deployed_source_commit}",
            "verification_workflow_commit": "${GITHUB_SHA}",
            "verified_at": "${verified_at}",
            "workflow_run": "${run_url}",
            "checks": [
              "production HTML matches current gh-pages index bytes",
              "2026 year/search/grid/filter/mobile controls",
              "Explore first-action journey at /anime/explore/",
              "wrapped multi-line card tags",
              "no per-card horizontal tag scrolling",
              "app.js and tag-ranking.js syntax and feature markers",
              "data/manifest.json parse"
            ]
          }
          JSON
          encoded="$(base64 -w 0 "$marker")"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/verification/live-pages.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/verification/live-pages.json" -f message="Record live Pages verification for ${deployed_source_commit}" -f content="$encoded" -f branch=main)
          if [[ -n "$current_sha" ]]; then
            args+=(-f sha="$current_sha")
          fi
          gh api "${args[@]}" --jq '{commit: .commit.html_url, content: .content.html_url}'