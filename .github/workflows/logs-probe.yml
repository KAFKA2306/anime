name: Probe failed ontology log

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/logs-probe.yml
      - verification/logs-probe-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record failed job tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '89655532975'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          tail -n 350 /tmp/job.log > /tmp/bootstrap-error.txt
          encoded="$(base64 -w 0 /tmp/bootstrap-error.txt)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/verification/bootstrap-error.txt?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/verification/bootstrap-error.txt" -f message='Record failed ontology job tail' -f content="$encoded" -f branch=main)
          if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" --jq '.commit.html_url'