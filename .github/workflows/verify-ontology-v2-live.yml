name: Verify ontology v2 on live Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/verify-live-ontology-v2.trigger'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: verify-ontology-v2-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Request configured GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages-config.json
          cat /tmp/pages-config.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Wait for GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > /tmp/pages-build.json
            status=$(jq -r '.status // "unknown"' /tmp/pages-build.json)
            echo "Pages build attempt $attempt: $status"
            if [ "$status" = "built" ]; then
              cat /tmp/pages-build.json
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              cat /tmp/pages-build.json
              exit 1
            fi
            sleep 5
          done
          cat /tmp/pages-build.json
          echo 'Pages build did not reach built status.' >&2
          exit 1

      - name: Install verifier dependencies
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify public JSON and rendered cards
        run: node scripts/verify-live-ontology-v2.mjs

      - name: Commit live verification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/ontology-v2-live.json
          if git diff --cached --quiet; then
            echo 'Verification evidence is unchanged.'
            exit 0
          fi
          git commit -m 'Record live ontology v2 Pages verification'
          git push origin HEAD:"$TARGET_BRANCH"
