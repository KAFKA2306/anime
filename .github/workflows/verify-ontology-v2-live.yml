name: Verify ontology v2 on live Pages

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-ontology-v2-live
  cancel-in-progress: false

jobs:
  verify-live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[automation] verify live ontology v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install verifier dependencies
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify public JSON and rendered cards
        run: node scripts/verify-live-ontology-v2.mjs

      - name: Commit live verification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/ontology-v2-live.json
          if git diff --cached --quiet; then
            echo 'Verification evidence is unchanged.'
            exit 0
          fi
          git commit -m 'Record live ontology v2 Pages verification'
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'Live ontology v2 JSON and rendered-card verification passed.'
