name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - tag-ranking.css
      - tag-ranking.js
      - data/**
      - scripts/build-catalog-api.mjs
      - tests/catalog-api.test.mjs
      - docs/catalog-api.md
      - package.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - index.html
      - styles.css
      - app.js
      - tag-ranking.css
      - tag-ranking.js
      - data/**
      - scripts/build-catalog-api.mjs
      - tests/catalog-api.test.mjs
      - docs/catalog-api.md
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate static application and data
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s tag-ranking.css
          test -s tag-ranking.js
          test -s data/manifest.json
          test -s data/works.json
          test -d data/by-year
          test -s data/likes/2024.tsv
          node --check app.js
          node --check tag-ranking.js
          node scripts/validate-data.mjs
          node --test tests/catalog-api.test.mjs
          node scripts/build-catalog-api.mjs
          python -m json.tool data/manifest.json > /dev/null
          python -m json.tool api/v1/manifest.json > /dev/null
          python -m json.tool api/v1/works.json > /dev/null
          python -m json.tool api/v1/facets.json > /dev/null
          test "$(node -p "JSON.parse(require('fs').readFileSync('api/v1/manifest.json')).counts.works")" = "$(node -p "JSON.parse(require('fs').readFileSync('data/manifest.json')).canonical_work_count")"
          grep -F '20260725-all-years-tags-1' index.html
          grep -F 'tag-ranking.css' index.html
          grep -F 'tag-ranking.js' index.html
          grep -F 'id="activeFilterBar"' index.html
          grep -F 'id="mobileStatusText"' index.html
          grep -F 'class="work-card__link"' index.html
          grep -F -- '--lavender:' styles.css
          grep -F -- '--rose:' styles.css
          grep -F -- '--mint:' styles.css
          grep -F 'normalize(tag) === normalize(activeTag)' tag-ranking.js
          grep -F 'タグ内 #' tag-ranking.js
          grep -F "url.searchParams.set('tag'" tag-ranking.js
          grep -F 'content-visibility: auto' tag-ranking.css
          grep -F '.responsive-control' tag-ranking.css
          grep -F '.mobile-status' tag-ranking.css
          grep -F 'flex-wrap: wrap' tag-ranking.css
          grep -F 'overflow: visible' tag-ranking.css
          grep -F 'white-space: normal' tag-ranking.css
          if grep -F '.work-card>.work-card__tags' tag-ranking.css | grep -F 'overflow-x:auto'; then
            echo 'Per-card horizontal tag scrolling must not return.' >&2
            exit 1
          fi

      - name: Build Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data/by-year _site/data/likes _site/api
          cp index.html styles.css app.js tag-ranking.css tag-ranking.js _site/
          cp data/manifest.json _site/data/
          cp data/by-year/*.json _site/data/by-year/
          cp data/likes/*.tsv _site/data/likes/
          cp -R api/v1 _site/api/
          touch _site/.nojekyll

      - name: Upload API audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-catalog-api-v1
          path: api/v1
          retention-days: 30
          if-no-files-found: error

      - name: Publish the configured gh-pages source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
