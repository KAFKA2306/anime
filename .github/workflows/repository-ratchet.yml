name: Repository Ratchet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Verify canonical repository flow
        run: npm run verify:ratchet
      - name: Run existing tests
        run: npm test
      - name: Validate canonical data
        run: npm run validate
      - name: Verify clean checkout
        run: |
          rm -rf node_modules
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
